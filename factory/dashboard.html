<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Board</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e0;
    --pass: #2f9e5b; --changes: #d98a1c; --pending: #c8c8c8; --human: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151518; --panel: #1f1f23; --text: #ececee; --muted: #9a9aa2; --line: #2e2e34; --pending: #4a4a52; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 18px; }
  header span { color: var(--muted); font-size: 12px; }
  #human:empty { display: none; }
  #human { margin: 8px 24px 0; padding: 12px; border: 2px solid var(--human); border-radius: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  #human::before { content: "Needs human"; width: 100%; color: var(--human); font-weight: 600; font-size: 12px; }
  #board { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 12px; padding: 16px 24px; overflow-x: auto; }
  .col h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .card:hover { border-color: var(--muted); }
  #human .card { margin: 0; min-width: 220px; }
  .id { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .meta a { color: inherit; }
  .rounds { margin-top: 8px; display: grid; gap: 4px; }
  .row { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
  .row b { width: 22px; font-weight: 500; }
  .chip { padding: 1px 6px; border-radius: 99px; border: 1px solid var(--pending); color: var(--muted); }
  .chip.PASS { background: var(--pass); border-color: var(--pass); color: #fff; }
  .chip.CHANGES { background: var(--changes); border-color: var(--changes); color: #fff; }
  .empty { color: var(--muted); padding: 40px 24px; }
  #drawer { position: fixed; inset: 0 0 0 auto; width: min(640px, 100%); background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 24px; transform: translateX(100%); transition: transform .2s; }
  #drawer.open { transform: none; }
  #drawer button { float: right; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .file { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
  .file > .path { font: 12px ui-monospace, monospace; color: var(--muted); }
  .file pre { white-space: pre-wrap; background: var(--bg); padding: 8px; border-radius: 6px; font-size: 12px; }
  .shots { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: start; font-size: 12px; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .file h1, .file h2, .file h3 { font-size: 15px; margin: 12px 0 4px; }
</style>
</head>
<body>
<header><h1>Software Factory</h1><span id="updated"></span></header>
<div id="human"></div>
<div id="board"></div>
<aside id="drawer"><button onclick="drawer.classList.remove('open')">Close</button><div id="files"></div></aside>
<script>
const STAGES = [["spec", "Spec"], ["build", "Build"], ["review", "Review"], ["approval", "Approver"], ["merged", "Shipped"]];
const REVIEWERS = ["security", "ux", "ui", "code"];
const NEXT = {
  "spec-review": id => `refine spec, then /factory build ${id}`,
  "needs-human": id => `review the PR, then /factory approve ${id}`,
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function chips(n, reviews) {
  return `<div class="row"><b>R${n}</b>${REVIEWERS.map(r =>
    `<span class="chip ${reviews[r] || "pending"}">${r}</span>`).join("")}</div>`;
}

function card(job) {
  const rounds = [...(job.history || []), ...(job.reviews ? [job.reviews] : [])];
  return `<div class="card" data-id="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    <div class="meta">${esc(job.title || "")}${job.round ? ` · round ${job.round}` : ""}${job.pr ? ` · <a href="${esc(job.pr)}" target="_blank">PR</a>` : ""}</div>
    ${NEXT[job.stage] ? `<div class="meta">${NEXT[job.stage](esc(job.id))}</div>` : ""}
    ${rounds.length ? `<div class="rounds">${rounds.map((r, i) => chips(i + 1, r)).join("")}</div>` : ""}
  </div>`;
}

let jobs = [];
async function refresh() {
  try {
    jobs = (await (await fetch("board.json", { cache: "no-store" })).json()).jobs || [];
  } catch { jobs = []; }
  human.innerHTML = jobs.filter(j => ["spec-review", "needs-human"].includes(j.stage)).map(card).join("");
  board.innerHTML = jobs.length ? STAGES.map(([key, label]) => `<div class="col"><h2>${label}</h2>
    ${jobs.filter(j => j.stage === key).map(card).join("")}</div>`).join("")
    : `<div class="empty">No jobs yet. Run <code>/factory &lt;feature&gt;</code> or <code>/factory next</code>.</div>`;
  updated.textContent = "updated " + new Date().toLocaleTimeString();
}

function md(text) {
  return esc(text).split(/\n```[^\n]*\n([\s\S]*?)\n```/).map((part, i) => i % 2 ? `<pre>${part}</pre>` :
    part.replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>").replace(/(<\/h\d>)(<br>)+/g, "$1")).join("");
}

async function open(id) {
  const job = jobs.find(j => j.id === id);
  const paths = ["spec.md", "build.md"];
  for (let n = 1; n <= (job.round || 0); n++) [...REVIEWERS, "human"].forEach(r => paths.push(`round-${n}/review-${r}.md`));
  paths.push("decision.md");
  const loaded = await Promise.all(paths.map(async p => {
    const res = await fetch(`jobs/${id}/${p}`, { cache: "no-store" }).catch(() => null);
    return res && res.ok ? `<div class="file"><div class="path">${p}</div>${md(await res.text())}</div>` : "";
  }));
  const shots = (job.shots || []).map(s => `<span>${esc(s)}</span>` + ["before", "after"].map(w =>
    `<img src="jobs/${esc(id)}/shots/${w}/${esc(s)}.png" alt="${w}" onerror="this.replaceWith('new')">`).join("")).join("");
  files.innerHTML = `<h1>${esc(id)}</h1><div class="meta">${esc(job.branch || "")} · ${esc(job.stage)}</div>` +
    (shots ? `<div class="file"><div class="path">screenshots · before / after</div><div class="shots">${shots}</div></div>` : "") + loaded.join("");
  drawer.classList.add("open");
}

document.addEventListener("click", e => { if (e.target.closest("a")) return; const c = e.target.closest(".card"); if (c) open(c.dataset.id); });
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
