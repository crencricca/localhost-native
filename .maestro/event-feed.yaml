appId: com.crencricca.localhost
---
- launchApp
- assertVisible: "My Events"
# Main feed: upcoming soonest first (e4, e2, e5, e7). Below it, the Requested
# section (e1), then Past Events (e3). Past events the user did not attend
# (e6) are not shown anywhere. Cards carry no "Past" chip, since the
# Past Events heading already says it.
# Each card is one accessible element whose label starts with the title
# and includes the host label, so match both by regex.
- scrollUntilVisible:
    element: "Dinner reservation already confirmed.*Hosted by Marguerite W\\..*"
    direction: DOWN
- assertNotVisible: "Dinner reservation already confirmed.*Declined.*"
- scrollUntilVisible:
    element: "Coffee and planning session.*Hosted by Catie R\\..*"
    direction: DOWN
- scrollUntilVisible:
    element: "Spontaneous ramen if anyone is nearby.*Hosted by Catie R\\..*"
    direction: DOWN
- scrollUntilVisible:
    element: "Board game marathon.*Hosted by Marissa C\\..*Declined.*"
    direction: DOWN
- assertNotVisible: "Board game marathon.*Past.*"
- scrollUntilVisible:
    element: "Requested"
    direction: DOWN
- scrollUntilVisible:
    element: "Two extra tickets for Friday concert.*Hosted by Aidan C\\..*"
    direction: DOWN
- assertNotVisible: "Two extra tickets for Friday concert.*Declined.*"
- scrollUntilVisible:
    element: "Past Events"
    direction: DOWN
- scrollUntilVisible:
    element: "Sunday picnic \\+ cards.*Hosted by Zach B\\..*"
    direction: DOWN
- assertNotVisible: "Sunday picnic \\+ cards.*Past.*"
- assertNotVisible: "Sunday picnic \\+ cards.*Declined.*"
- scroll
- assertNotVisible: "Rooftop karaoke.*"
